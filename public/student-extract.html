<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Витяг здобутків студентів</title>
  <style>
    @page { size: A4; margin: 17mm 15mm 18mm } * { box-sizing: border-box } body { margin: 0; color: #15213a; font: 12px/1.5 Arial, sans-serif } header { border-bottom: 2px solid #1e5eff; padding-bottom: 12px; margin-bottom: 22px } h1 { margin: 0 0 6px; font-size: 23px } h2 { margin: 0 0 5px; font-size: 16px }.muted { margin: 0; color: #60708a }.student { break-inside: avoid; border: 1px solid #dce4f0; border-radius: 8px; padding: 15px; margin: 0 0 14px }.facts { color: #60708a; margin: 0 0 12px }.activity { border-top: 1px solid #e6ebf3; padding: 11px 0 0; margin-top: 11px }.tag { display: inline-block; padding: 3px 7px; border-radius: 999px; color: #1552d5; background: #eaf0ff; font-size: 10px; font-weight: bold; text-transform: uppercase }.activity h3 { margin: 6px 0 3px; font-size: 13px }.activity p { margin: 3px 0; white-space: pre-wrap } a { color: #1552d5; overflow-wrap: anywhere } #print { position: fixed; top: 12px; right: 12px; border: 0; border-radius: 7px; background: #1e5eff; color: #fff; padding: 10px 14px; cursor: pointer; font: inherit } @media print { #print { display: none } }
  </style>
</head>
<body>
  <button id="print" type="button">Save як PDF</button><header><h1>Витяг здобутків студентів</h1><p id="summary" class="muted">Формування документа…</p></header><main id="content"></main>
  <script>
    const escapeHtml = (value) => String(value || '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[char]))
    const date = (value) => value ? new Intl.DateTimeFormat('uk-UA', { dateStyle: 'medium' }).format(new Date(value)) : 'Дату не вказано'
    const params = new URLSearchParams(location.search); const studentId = params.get('student_id') || 'all'; const selectedCategories = new Set((params.get('categories') || '').split(',').filter(Boolean))
    fetch('/api/students').then(async (response) => { const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.error); return data }).then((data) => {
      const rows = (data.students || []).filter((student) => studentId === 'all' || String(student.id) === studentId).map((student) => ({ ...student, activities: student.activities.filter((activity) => selectedCategories.has(activity.category_name)) })).filter((student) => student.activities.length)
      const studentLabel = studentId === 'all' ? 'All студенти' : (data.students || []).find((student) => String(student.id) === studentId)?.full_name || 'Обраний студент'
      document.querySelector('#summary').textContent = `Student: ${studentLabel}. Категорії: ${[...selectedCategories].join(', ')}. Сформовано: ${date(new Date())}.`
      document.querySelector('#content').innerHTML = rows.length ? rows.map((student) => `<section class="student"><h2>${escapeHtml(student.full_name)}</h2><p class="facts">${escapeHtml([student.group_name, student.study_level, student.course && `${student.course} курс`].filter(Boolean).join(' · ') || 'Student')}</p>${student.activities.map((activity) => `<article class="activity"><span class="tag">${escapeHtml(activity.category_name)}</span><h3>${escapeHtml(activity.title)}</h3><p class="muted">${escapeHtml([date(activity.activity_date), activity.organizer, activity.location].filter(Boolean).join(' · '))}</p>${activity.description ? `<p>${escapeHtml(activity.description)}</p>` : ''}${activity.link ? `<p><a href="${escapeHtml(activity.link)}">${escapeHtml(activity.link)}</a></p>` : ''}</article>`).join('')}</section>`).join('') : '<p>За вказаними параметрами публічних здобутків не знайдено.</p>'
    }).catch(() => { document.querySelector('#content').textContent = 'Could not сформувати витяг.' })
    document.querySelector('#print').onclick = () => window.print()
  </script>
</body>
</html>
